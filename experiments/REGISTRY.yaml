  - id: EXP-B05
    name: EMBEDDING_FALLBACK
    baseline: B5
    hypothesis: H2
    description: "Subword n-gram TF-IDF fallback (CodeBERT not available)"
    dataset_splits: [dev, test]
    input: source_code_pairs
