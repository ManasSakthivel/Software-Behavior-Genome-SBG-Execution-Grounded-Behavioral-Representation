experiments:
  - id: EXP-B01
    name: TOKEN_TFIDF
    baseline: B1
    hypothesis: H2
    description: "Token-level TF-IDF cosine similarity"
    dataset_splits: [dev, test]
    input: source_code_pairs
    output: similarity_scores
    threshold_selection: DEV_only
    primary_metric: F1
    secondary_metrics: [AUROC, AUPRC, accuracy, precision, recall]
    statistical_test: McNemar_paired
    seed: 42
    artifact_path: artifacts/phase3/B01/
    status: COMPLETE
    test_f1: 0.5843
    test_auroc: 0.4043

  - id: EXP-B02
    name: AST_SIMILARITY
